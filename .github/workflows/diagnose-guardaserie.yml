name: Diagnose candidate GuardaSerie domain
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnosis:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check candidate site without accessing video streams
        run: python scripts/diagnose_guardaserie.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guardaserie-diagnostic
          path: guardaserie-diagnostic.json
