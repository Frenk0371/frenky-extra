name: Build Frenky Extra

concurrency:
  group: frenky-extra-build
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'MultiSource/**'
      - 'FilmPerTutti/**'
      - 'CasaCinema/**'
      - 'GuardoSerie/**'
      - '.github/workflows/build.yml'
      - 'repo.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned official CloudStream Gradle plugin
        uses: actions/checkout@v4
        with:
          repository: recloudstream/gradle
          ref: 32895aedb6366f5075cb99bbd2e6ce0a7cac325d
          path: .cloudstream-gradle
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Build extension artifacts
        run: gradle make makePluginsJson --no-daemon
      - name: Publish builds branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/cloudstream-dist
          cp repo.json /tmp/cloudstream-dist/repo.json
          cp build/plugins.json /tmp/cloudstream-dist/plugins.json
          find FilmPerTutti/build CasaCinema/build GuardoSerie/build -type f -name '*.cs3' -exec cp {} /tmp/cloudstream-dist/ \;
          test "$(find /tmp/cloudstream-dist -name '*.cs3' | wc -l)" -eq 3
          cd /tmp/cloudstream-dist
          git init -b builds
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Build $GITHUB_SHA"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:builds
