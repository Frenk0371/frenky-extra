name: Build Frenky Extra

concurrency:
  group: frenky-extra-build-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'MultiSource/**'
      - 'FilmPerTutti/**'
      - 'CasaCinema/**'
      - 'GuardaSerie/**'
      - '.github/workflows/build.yml'
      - 'repo.json'
      - 'scripts/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned official CloudStream Gradle plugin
        uses: actions/checkout@v4
        with:
          repository: recloudstream/gradle
          ref: 32895aedb6366f5075cb99bbd2e6ce0a7cac325d
          path: .cloudstream-gradle
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Test distribution validator
        run: python -m unittest discover -s scripts/tests -v
      - name: Build extension artifacts
        run: gradle testDebugUnitTest make makePluginsJson --no-daemon
      - name: Verify GuardaSerie live catalogue
        env:
          GUARDASERIE_LIVE_TEST: '1'
        run: gradle :GuardaSerie:testDebugUnitTest --tests com.frenky.extra.guardaserie.GuardaSerieLiveTest --rerun-tasks --no-daemon
      - name: Upload isolated Android TV beta plugins
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: android-tv-plugins-v9-test-only
          path: |
            FilmPerTutti/build/**/*.cs3
            CasaCinema/build/**/*.cs3
          if-no-files-found: error
      - name: Read existing published providers
        uses: actions/checkout@v4
        with:
          ref: builds
          path: .published-builds
          persist-credentials: false
      - name: Validate distribution
        run: |
          mkdir -p /tmp/cloudstream-dist
          cp repo.json /tmp/cloudstream-dist/repo.json
          cp build/plugins.json /tmp/cloudstream-dist/plugins.json
          find GuardaSerie/build -type f -name '*.cs3' -exec cp {} /tmp/cloudstream-dist/ \;
          python scripts/preserve_movie_providers.py /tmp/cloudstream-dist .published-builds
          test "$(find /tmp/cloudstream-dist -name '*.cs3' | wc -l)" -eq 3
          python scripts/verify_dist.py /tmp/cloudstream-dist .published-builds
      - name: Upload review artifacts
        uses: actions/upload-artifact@v4
        with:
          name: reviewed-extension-build
          path: /tmp/cloudstream-dist
      - name: Publish builds branch
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd /tmp/cloudstream-dist
          git init -b builds
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Build $GITHUB_SHA"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:builds
